# NOTE: Replace literal values before applying in production.
# Generate: kubectl create secret generic healthcare-secrets \
#   --from-literal=JWT_SECRET=$(openssl rand -hex 48) \
#   --from-literal=PHI_ENCRYPTION_KEY=$(openssl rand -base64 32) \
#   --from-literal=MONGO_URI='mongodb://mongo:27017/healthcare' \
#   -n healthcare
apiVersion: v1
kind: Secret
metadata:
  name: healthcare-secrets
  namespace: healthcare
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_48_BYTE_HEX"
  PHI_ENCRYPTION_KEY: "REPLACE_ME_32_BYTE_BASE64"
  MONGO_URI: "mongodb://mongo:27017/healthcare"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-config
  namespace: healthcare
data:
  NODE_ENV: "production"
  FORCE_HTTPS: "true"
  PORT: "3000"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://healthcare.example.com"
