apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-app
  namespace: healthcare
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: healthcare
  name: healthcare-app-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcare-app-rb
  namespace: healthcare
subjects:
  - kind: ServiceAccount
    name: healthcare-app
    namespace: healthcare
roleRef:
  kind: Role
  name: healthcare-app-role
  apiGroup: rbac.authorization.k8s.io
