groups:
  - name: healthcare-app
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: ">5% 5xx error rate on healthcare-app"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency > 1s"

      - alert: AuthBruteForceSuspected
        expr: |
          increase(http_request_duration_seconds_count{route="/api/auth/login",status="401"}[5m]) > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Possible brute-force on /api/auth/login"
